[project]
name = "learner"
version = "0.1.0"
description = "Personal learning app: Python, FastAPI, DSA with Claude"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pyyaml>=6.0",
    "markdown-it-py>=3.0",
    "python-multipart>=0.0.9",
    "claude-agent-sdk>=0.1",
    "pytest>=8.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    # used by FastAPI exercises / project reference solutions
    "pydantic-settings>=2.4",
    "alembic>=1.13",
    "groq>=1.7.0",
    "numpy>=2.5.5",
    "chromadb>=1.5.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

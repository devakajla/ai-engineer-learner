- q: What is a good first step when choosing a model for a new task?
  type: single
  options:
    - Pick the biggest model to be safe
    - Collect real examples and try the smallest model first
    - Pick the model with the longest name
    - Pick whichever is top of a public leaderboard
  answer: [1]
  explain: Start small and test on your own examples. Move up only if the small model fails. Leaderboards help to shortlist but do not replace your own tests.
- q: Which of these are true about open models?
  type: multi
  options:
    - Their weights can be downloaded
    - You can keep data inside your own network
    - They never have licence rules
    - A host like Groq can run them for you per token
  answer: [0, 1, 3]
  explain: Open models have downloadable weights, allow private hosting, and can be run by hosts. Some still have licence rules, so read them.
- q: What does a fallback do?
  type: single
  options:
    - It makes the model answer faster
    - It tries another model when the first one fails
    - It lowers the temperature
    - It stores the answer for later
  answer: [1]
  explain: A fallback is plan B. If the main model fails or is rate limited, you try the next model in your list.
- q: |
    What is printed?
    ```python
    plans = {"a": {"price": 5, "gb": 2}, "b": {"price": 9, "gb": 30}, "c": {"price": 7, "gb": 25}}
    best = None
    best_price = None
    for name, plan in plans.items():
        if plan["gb"] < 20:
            continue
        if best_price is None or plan["price"] < best_price:
            best = name
            best_price = plan["price"]
    print(best)
    ```
  type: single
  options: ["`a`", "`b`", "`c`", "`None`"]
  answer: [2]
  explain: Plan "a" is skipped (too little data). Of "b" (9) and "c" (7), "c" is cheaper.
- q: A request is easy (classify a short email). Which choice is the best fit?
  type: single
  options:
    - The largest, most expensive model
    - A small, fast model
    - No model, use temperature 2
    - A model with the biggest context window
  answer: [1]
  explain: Easy tasks run well on small models, which are faster and cheaper.
- q: What is model routing?
  type: single
  options:
    - Sending each request to the model that suits it
    - Sending the same request to all models and merging the answers
    - Choosing a Wi-Fi route
    - Retrying a failed call
  answer: [0]
  explain: Routing picks a model per request, for example a small model for easy steps and a big one for hard steps.
- q: Why is it risky to trust public benchmarks alone?
  type: single
  options:
    - They are always wrong
    - Your task is not their task, and models may have seen the test questions
    - They only test images
    - They only apply to open models
  answer: [1]
  explain: Benchmarks help to shortlist. Your own examples show how a model does on your real task.

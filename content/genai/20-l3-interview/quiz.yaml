- q: Which statements about embeddings are true?
  type: multi
  options:
    - Documents and queries must be embedded with the same model
    - Vectors from two different models can be compared directly
    - Changing the embedding model means re-embedding all documents
    - A bigger dimension is always better
  answer: [0, 2]
  explain: Each model has its own space. A bigger dimension can hold more detail but is not always better, and it costs memory.

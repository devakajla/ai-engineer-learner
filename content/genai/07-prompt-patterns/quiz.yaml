- q: What is few-shot prompting?
  type: single
  options:
    - Asking the model the same question a few times
    - Giving a few examples of input and the output you want
    - Using a small model
    - Setting the temperature low
  answer: [1]
  explain: Few-shot means showing a few solved examples in the prompt. Zero-shot means no examples.
- q: |
    Examples are sent as fake chat turns. What is the right order for one example?
  type: single
  options:
    - assistant message, then user message
    - user message (the input), then assistant message (the answer you want)
    - system message, then assistant message
    - Both in one user message
  answer: [1]
  explain: The user turn holds the example input. The assistant turn holds the wanted output. The real question comes last as a user turn.
- q: |
    What is printed?
    ```python
    examples = [("a", "1"), ("b", "2")]
    messages = []
    for inp, out in examples:
        messages.append({"role": "user", "content": inp})
        messages.append({"role": "assistant", "content": out})
    print(len(messages), messages[1]["content"])
    ```
  type: single
  options: ["`2 1`", "`4 1`", "`4 2`", "`2 2`"]
  answer: [1]
  explain: Each pair adds two messages, so 4 in total. messages[1] is the assistant message of the first pair, which is "1".
- q: Why wrap a document in delimiters like `<document>` and `</document>`?
  type: single
  options:
    - To make the model faster
    - To separate the data from the instructions
    - It is required by the API
    - To lower the token count
  answer: [1]
  explain: Delimiters make it clear where the data starts and ends. This avoids confusion, and helps a little against injected instructions.
- q: |
    What is printed?
    ```python
    labels = ["positive", "negative"]
    reply = "  Negative.\n"
    cleaned = reply.strip().lower().strip(".")
    print(cleaned if cleaned in labels else "unknown")
    ```
  type: single
  options: ["`Negative.`", "`negative`", "`unknown`", "`positive`"]
  answer: [1]
  explain: strip removes spaces and the newline, lower makes it lowercase, the second strip removes the dot. "negative" is in the labels.
- q: Which of these reduce hallucinations in a document question-answering prompt?
  type: multi
  options:
    - Say "answer only from the text between the tags"
    - Give an exact reply to use when the answer is missing
    - Ask for the answer as quickly as possible
    - Put the trusted text in the prompt
  answer: [0, 1, 3]
  explain: Trusted context plus an "only from this text" rule plus a fixed "I don't know" reply are the standard defences. Asking for speed does not help.
- q: A classifier prompt says "answer with only the label". Why still check the reply in code?
  type: single
  options:
    - The model sometimes adds spaces, dots, capitals or extra words
    - The API changes the reply
    - Python cannot read model replies
    - Labels must be numbers
  answer: [0]
  explain: Models do not always follow the format. Clean and check the reply, and use a safe value such as "unknown" when it does not match.
- q: What is self-consistency?
  type: single
  options:
    - Asking the same hard question several times and taking the most common answer
    - Using the same temperature in every call
    - Asking the model to repeat your question
    - Keeping the system prompt the same for every user
  answer: [0]
  explain: Self-consistency samples several answers at a higher temperature and votes. It is more accurate but costs more calls.

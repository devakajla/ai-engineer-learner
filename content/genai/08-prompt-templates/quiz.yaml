    print(names)
    ```
  type: single
  options: ["`['a', 'b']`", "`['a', 'b', 'a']`", "`['a', 'a', 'b']`", "`[]`"]
  answer: [1]
  explain: parse gives every placeholder in order, including repeats. This list is not made unique.
- q: |
    What is printed?
    ```python
    versions = ["v1", "v10", "v2"]
    print(max(versions))
    ```
  type: single
  options: ["`v10`", "`v2`", "`v1`", "A `TypeError`"]
  answer: [1]
  explain: Strings compare character by character. "v2" is bigger than "v10" because "2" is bigger than "1". To find the latest, compare the numbers.
- q: Why keep prompt versions and log which one was used?
  type: multi
  options:
    - You can go back if a new prompt is worse
    - You can compare versions on the same test questions
    - You can tell which prompt wrote a bad answer
    - It makes the model faster
  answer: [0, 1, 2]
  explain: Versioning helps rollback, comparison and debugging. It has no effect on model speed.

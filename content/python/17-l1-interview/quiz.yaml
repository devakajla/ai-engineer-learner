- q: |
    What is printed?
    ```python
    try:
        print("a")
        {}["k"]
    except KeyError:
        print("b")
    else:
        print("c")
    finally:
        print("d")
    ```
  type: single
  options: ["`a b d`", "`a c d`", "`a d`", "`b d`"]
  answer: [0]
  explain: '`a` prints, then the missing key raises KeyError, so `except` runs, `else` is skipped, and `finally` runs.'

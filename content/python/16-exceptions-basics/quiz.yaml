        if age < 0:
            raise ValueError("negative")
        return age

    set_age(-5)
    ```
  type: single
  options: ["Returns `-5`", "Raises ValueError with message `negative`", "Returns `None`", "Prints `negative`"]
  answer: [1]
  explain: '`raise` stops the function and sends the error to the caller.'

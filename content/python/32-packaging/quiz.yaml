- q: Why do we use a virtual environment for each project?
  type: single
  options:
    - Each project gets its own Python libraries, so versions do not clash
    - It makes Python run faster
    - It is required to import the standard library
    - It saves the code to the cloud
  answer: [0]
  explain: A venv is a private folder of libraries for one project. Two projects can then use different versions of the same library.
- q: What is the job of `uv.lock`?
  type: single
  options:
    - It records the exact version of every installed library, so installs are repeatable
    - It stops other people from reading the project
    - It lists the Python files in the project
    - It stores the passwords
  answer: [0]
  explain: pyproject.toml says what you accept. uv.lock records exactly what was chosen. Commit it, and never edit it by hand.
- q: |
    What is printed?
    ```python
    print("1.10.0" > "1.9.0")
    print((1, 10, 0) > (1, 9, 0))
    ```
  type: single
  options: ["`True` then `True`", "`False` then `True`", "`True` then `False`", "`False` then `False`"]
  answer: [1]
  explain: Text compares character by character, and "1" is smaller than "9". Tuples of ints compare number by number, so 10 is larger than 9.
- q: Which version rule means "any version from 1.4 up to, but not including, 2.0"?
  type: single
  options: ["`pkg==1.4`", "`pkg>=1.4,<2.0`", "`pkg<1.4,>2.0`", "`pkg!=2.0`"]
  answer: [1]
  explain: A comma means "and". Both parts must be true.
- q: Where should a test library like pytest go?
  type: single
  options:
    - In the `dev` dependency group (`uv add --dev pytest`)
    - In `dependencies`, like every library
    - Inside `uv.lock`
    - It does not need to be listed
  answer: [0]
  explain: Dev tools are needed only while developing. Keeping them in the dev group keeps the production install small.
- q: What does this line in `pyproject.toml` do?
  type: single
  options:
    - It makes a command `taskflow` that runs the function `main` in `taskflow/cli.py`
    - It imports the `taskflow` package
    - It installs a library called `taskflow`
    - It renames the project
  answer: [0]
  explain: "`[project.scripts]` maps a command name to `module:function`. After install, running `taskflow` calls that function."
- q: Which files should be committed to git?
  type: multi
  options: ["`pyproject.toml`", "`uv.lock`", "`.venv/`", "The source code"]
  answer: [0, 1, 3]
  explain: The .venv folder can be rebuilt with uv sync, so it is not committed.

- q: When does `__exit__` run?
  type: single
  options:
    - Only when the block finishes normally
    - Only when an exception occurs
    - Always — normal exit, exception, return or break
    - Only if `__enter__` returned self
  answer: [2]
  explain: That guarantee is the whole point of context managers.
- q: An exception happens inside a `with` block and `__exit__` returns `True`. What happens?
  type: single
  options: ["The exception propagates", "The exception is suppressed", "Python raises a TypeError", "The block is re-run"]
  answer: [1]
  explain: A truthy return value from __exit__ suppresses the exception. Use this only on purpose.
- q: |
    In a `@contextmanager` generator, where is an exception from the with-block raised?
    ```python
    @contextmanager
    def cm():
        setup()
        yield
        teardown()
    ```
  type: single
  options: ["Before setup()", "At the `yield`", "After teardown()", "It isn't raised at all"]
  answer: [1]
  explain: The exception is thrown into the generator at the yield — so here teardown() is skipped. Wrap the yield in try/finally.
- q: What should a transaction context manager do?
  type: multi
  options: ["Commit when the block succeeds", "Roll back when the block raises", "Swallow the exception after rollback", "Re-raise the exception after rollback"]
  answer: [0, 1, 3]
  explain: Swallowing errors hides failures from callers; roll back and re-raise.
- q: What does the value returned by `__enter__` become?
  type: single
  options: ["Nothing", "The target of `as`", "The return value of the with statement", "The argument of `__exit__`"]
  answer: [1]
  explain: '`with X() as y` binds y to `X().__enter__()`.'
- q: FastAPI's `lifespan=` function for startup/shutdown is...
  type: single
  options: ["A decorator", "An async context manager (code before/after yield)", "A middleware", "A background task"]
  answer: [1]
  explain: Startup code runs before the yield, shutdown code after it.

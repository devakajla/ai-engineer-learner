- q: Which work benefits from `ThreadPoolExecutor` in normal CPython?
  type: single
  options:
    - Waiting for many network calls
    - Adding up numbers in a huge loop
    - Compressing big files in pure Python code
    - Sorting a huge list
  answer: [0]
  explain: Threads help when they spend time waiting, because a waiting thread lets go of the GIL. CPU-bound work needs processes.
- q: |
    What is printed?
    ```python
    import asyncio

    async def f(x):
        return x

    async def main():
        print(await asyncio.gather(f(1), f(2)))

    asyncio.run(main())
    ```
  type: single
  options: ["`[1, 2]`", "`[2, 1]`", "`(1, 2)`", "Two coroutine objects"]
  answer: [0]
  explain: gather returns a list of results in the order the coroutines were given.
- q: |
    What is the problem with this code?
    ```python
    async def main():
        await asyncio.sleep(1)
        time.sleep(5)
    ```
  type: single
  options:
    - "`time.sleep` blocks the event loop, so other tasks freeze"
    - "`async def` cannot call `print`"
    - "`await` is missing from `main`"
    - There is no problem
  answer: [0]
  explain: "Inside async code use `await asyncio.sleep(1)`."
- q: Which are true about `uv.lock`?
  type: multi
  options:
    - It records exact versions of all libraries
    - You should commit it to git
    - You should edit it by hand
    - uv writes and updates it
  answer: [0, 1, 3]
  explain: The lock file is generated by uv. Editing it by hand can break it.
- q: |
    What does this test do?
    ```python
    @pytest.mark.parametrize("n", [1, 2, 3])
    def test_small(n):
        assert n < 10
    ```
  type: single
  options: ["Runs 3 times, once per value", "Runs once with a list", "Runs 3 times in parallel threads", "Is skipped"]
  answer: [0]
  explain: parametrize creates one test per value, and pytest reports each of them.
- q: Your function sends an email. How do you test it without sending a real email?
  type: single
  options:
    - Pass the mailer into the function, and give a fake mailer in the test
    - Send the email to yourself
    - Skip the test
    - Make the function return `None`
  answer: [0]
  explain: This is dependency injection. A fake mailer records the calls, so the test can check them.
- q: Why does `x in some_set` beat `x in some_list` for big data, and what is its cost?
  type: single
  options:
    - O(1) on average against O(n)
    - O(n) against O(1)
    - O(log n) against O(n²)
    - They are the same
  answer: [0]
  explain: A set finds the item by its hash. A list checks every item until it finds a match.
- q: Which are good ways to cut memory use when you process a huge log file?
  type: multi
  options:
    - Read it line by line with a generator
    - Keep only counters, not all lines
    - Load all lines into a list first
    - Stop reading when you have the answer
  answer: [0, 1, 3]
  explain: A list of all lines uses memory for the whole file. The other three keep memory small.

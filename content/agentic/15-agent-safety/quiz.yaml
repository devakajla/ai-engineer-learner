- q: What is indirect prompt injection?
  type: single
  options:
    - The user types a rude message
    - Attacker text hidden in data the agent reads (a web page, an email, a tool result) that the model treats as an instruction
    - A bug in the tokenizer
    - Sending too many requests
  answer: [1]
  explain: The attacker never talks to the agent. They put text where the agent will read it.
- q: Which three together make the "lethal trifecta"?
  type: single
  options:
    - Private data, untrusted input and a way to send data out
    - A big model, a long prompt and a slow tool
    - Memory, tools and streaming
    - Embeddings, a vector DB and a reranker
  answer: [0]
  explain: With all three, an attacker's text can make the agent read secrets and send them away. Remove one to break the chain.
- q: |
    Why does `quarantine` replace `</tool_output>` inside the tool text?
  type: single
  options:
    - To save tokens
    - So the text cannot close the wrapper early and write instructions outside it
    - Because XML is forbidden
    - To make the output look nicer
  answer: [1]
  explain: If the attacker could write our closing tag, everything after it would look like it is outside the untrusted block.
- q: A tool is missing from your risk table. What risk should it get?
  type: single
  options:
    - low, so nothing breaks
    - high, so a person must approve until someone classifies it
    - medium
    - It should be removed from the agent without a message
  answer: [1]
  explain: Safe defaults. A tool nobody has reviewed must not run unchecked.
- q: Which are good safety layers for an agent with tools? (pick all)
  type: multi
  options:
    - Give each agent only the tools its job needs
    - Ask a human to approve irreversible actions, showing the exact call
    - Write a very long system prompt and nothing else
    - Keep an audit log of every call and decision
  answer: [0, 1, 3]
  explain: Prompts alone do not stop injection. Least privilege, approval and logging are design layers that limit the damage.
- q: Why can asking a human to approve every single tool call make an agent less safe?
  type: single
  options:
    - Humans are slow, so it costs money
    - Approval fatigue: people click yes without reading
    - It breaks the checkpointer
    - It makes the model forget
  answer: [1]
  explain: A few well-chosen approvals protect better than many that nobody reads.
- q: An agent reads untrusted web pages AND can read private files. What is a good fix?
  type: single
  options:
    - Add "be careful" to the prompt
    - Remove its way to send data out, or split it into an untrusted-reading agent with no secrets and a secrets agent that only sees a strict summary
    - Use a bigger model
    - Lower the temperature
  answer: [1]
  explain: Break one leg of the trifecta. Splitting the work keeps secrets and untrusted text apart.

- q: Which question is a good fit for a sliding window?
  type: single
  options:
    - Find the longest substring with no repeated letters
    - Find the number of paths in a tree
    - Find the best subsequence (not continuous) with the biggest sum
    - Sort a list in place
  answer: [0]
  explain: Sliding window works on a continuous part (subarray or substring) with a condition and a longest / shortest / count goal.

- q: |
    What is the output?
    ```python
    nums = [2, 1, 5, 1, 3, 2]
    k = 3
    total = sum(nums[:k])
    best = total
    for i in range(k, len(nums)):
        total += nums[i] - nums[i - k]
        best = max(best, total)
    print(best)
    ```
  type: single
  options: ["8", "9", "11", "6"]
  answer: [1]
  explain: Windows sums are 8, 7, 9, 6. The best is 9 (5 + 1 + 3).

- q: For a "find the MAXIMUM window" question, when do you shrink from the left?
  type: single
  options:
    - While the window is valid
    - While the window is invalid
    - Never
    - Only when hi reaches the end
  answer: [1]
  explain: For a maximum, you expand freely and shrink only when the rule breaks. After shrinking, the window is valid and you record its length.

- q: For a "find the MINIMUM window" question, what is the usual loop shape?
  type: single
  options:
    - "`while window is invalid:` shrink, then record"
    - "`while window is valid:` record the length, then shrink"
    - "Shrink once per step with an `if`"
    - "Never shrink, only expand"
  answer: [1]
  explain: Once the window is valid you try to make it smaller. Each time it is still valid, record and shrink again.

- q: Why is a sliding window with a `while` loop inside a `for` loop still O(n)?
  type: single
  options:
    - Because `while` is always faster than `for`
    - Because `lo` and `hi` each move right at most n times and never go back
    - Because it uses a set
    - It is really O(n²)
  answer: [1]
  explain: Each pointer moves at most n steps in total, so the work is at most about 2n.

- q: |
    Which are common mistakes? (choose all that apply)
  type: multi
  options:
    - Using `if` instead of `while` to shrink
    - Not deleting a key from the counter-dict when its count becomes 0
    - Using sliding window for sums when the numbers can be negative
    - Computing the window length as `hi - lo + 1`
  answer: [0, 1, 2]
  explain: "`hi - lo + 1` is the correct length. The other three are real bugs: one shrink step may not be enough, stale keys break `len(counts)`, and negatives break the shrinking rule."

- q: |
    A valid window is `[lo..hi]`. How many valid subarrays end exactly at `hi` (in a "count" question where every shorter window inside is also valid)?
  type: single
  options: ["1", "hi - lo", "hi - lo + 1", "hi"]
  answer: [2]
  explain: Every start from `lo` up to `hi` gives a valid subarray, which is `hi - lo + 1` starts.

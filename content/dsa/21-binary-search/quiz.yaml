- q: "What is the time complexity of binary search on a sorted list of n items?"
  type: single
  options: ["O(n)", "O(log n)", "O(n log n)", "O(1)"]
  answer: [1]
  explain: "The range halves every step, so about log2(n) steps."

- q: |
    What is the output?
    ```python
    nums = [1, 3, 5, 7, 9]
    lo, hi = 0, len(nums) - 1
    while lo <= hi:
        mid = (lo + hi) // 2
        if nums[mid] < 7:
            lo = mid + 1
        else:
            hi = mid - 1
    print(lo)
    ```
  type: single
  options: ["2", "3", "4", "5"]
  answer: [1]
  explain: "mid=2 (5<7) lo=3; mid=3 (7 is not <7) hi=2; the loop ends with lo=3, the first index with a value >= 7."

- q: "In the first-True template (lo < hi), what do you do when check(mid) is True?"
  type: single
  options: ["hi = mid", "hi = mid - 1", "lo = mid + 1", "return mid"]
  answer: [0]
  explain: "mid may be the answer, so keep it: hi = mid. Only drop mid when the check is False (lo = mid + 1)."

- q: "Which problems fit 'binary search on the answer'?"
  type: multi
  options:
    - "Smallest eating speed that finishes in h hours"
    - "Largest minimum distance between cows"
    - "Sum of all items in a list"
    - "Smallest ship capacity for D days"
  answer: [0, 1, 3]
  explain: "These ask for a min or max value with a yes/no check that flips once. A plain sum needs no search."

- q: "In a rotated sorted list, at any mid, what is always true?"
  type: single
  options: ["At least one half (left or right of mid) is sorted", "Both halves are sorted", "The minimum is at mid", "The list has duplicates"]
  answer: [0]
  explain: "The rotation point lies in only one half, so the other half is fully sorted."

- q: "Mountain array: arr[mid] < arr[mid + 1]. Where is the peak?"
  type: single
  options: ["To the right of mid", "To the left of mid", "At mid", "Nowhere"]
  answer: [0]
  explain: "Still going up at mid, so the peak is further right."

- q: "Sorted matrix where rows and columns are sorted separately. Which start gives an O(rows + cols) search?"
  type: single
  options: ["Top-right corner", "Top-left corner", "Bottom-right corner", "Any middle item"]
  answer: [0]
  explain: "The top-right is the biggest in its row and the smallest in its column, so each step drops a row or a column. Bottom-left works too."

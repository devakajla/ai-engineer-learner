- q: "Why does graph search need a visited set?"
  type: single
  options: ["Graphs can have cycles, so you could walk in circles forever", "Python requires it", "To sort the nodes", "To make the graph directed"]
  answer: [0]
  explain: "Without visited, a cycle sends you back to the same nodes again and again."

- q: |
    What is the output?
    ```python
    graph = {0: [1, 2], 1: [3], 2: [3], 3: []}
    visited, order = set(), []
    def visit(n):
        visited.add(n)
        order.append(n)
        for nb in graph[n]:
            if nb not in visited:
                visit(nb)
    visit(0)
    print(order)
    ```
  type: single
  options: ["[0, 1, 2, 3]", "[0, 1, 3, 2]", "[0, 2, 3, 1]", "[0, 3, 1, 2]"]
  answer: [1]
  explain: "DFS goes 0, then 1, then 1's neighbour 3, and only then comes back to 2."

- q: "Which search finds the fewest steps when every step costs the same?"
  type: single
  options: ["BFS", "DFS", "Sorting", "Binary search"]
  answer: [0]
  explain: "BFS reaches nodes in order of distance, so the first time it reaches the target is the shortest path."

- q: "In BFS, when should you mark a node as visited?"
  type: single
  options: ["When you push it into the queue", "When you pop it", "After the loop", "Never"]
  answer: [0]
  explain: "Marking at push time stops the same node from being queued many times."

- q: "How do you start a multi-source BFS (rotten oranges, nearest zero)?"
  type: single
  options: ["Put all the sources in the queue before the first step", "Run a separate BFS from each source", "Use a stack", "Sort the grid"]
  answer: [0]

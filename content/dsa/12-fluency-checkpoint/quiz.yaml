- q: |
    What is the output?
    ```python
    seen = set()
    out = []
    for x in [1, 2, 1, 3, 2]:
        if x not in seen:
            seen.add(x)
            out.append(x)
    print(out)
    ```
  type: single
  options: ["`[1, 2, 3]`", "`[1, 2, 1, 3, 2]`", "`[1, 1, 2, 2, 3]`", "`[3]`"]
  answer: [0]
  explain: 'Only the first time each value is seen it goes to the output list.'
- q: You need to know quickly whether a value was seen before, for 1 million values. Which structure?
  type: single
  options: ["A set", "A list", "A tuple", "A string"]
  answer: [0]
  explain: '`in` on a set is fast; on a list it scans every item.'

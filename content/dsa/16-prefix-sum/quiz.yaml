- q: |
    What is the output?
    ```python
    nums = [2, 4, 1, 6, 3]
    prefix = [0]
    for x in nums:
        prefix.append(prefix[-1] + x)
    print(prefix[4] - prefix[1])
    ```
  type: single
  options: ["11", "7", "13", "4"]
  answer: [0]
  explain: prefix is [0, 2, 6, 7, 13, 16]. prefix[4] - prefix[1] = 13 - 2 = 11, which is 4 + 1 + 6.

- q: With `prefix[0] = 0`, what is the sum of `nums[left..right]` (both included)?
  type: single
  options: ["prefix[right] - prefix[left]", "prefix[right + 1] - prefix[left]", "prefix[right + 1] - prefix[left + 1]", "prefix[right] - prefix[left - 1]"]
  answer: [1]
  explain: prefix[right + 1] has everything up to index right; prefix[left] is everything before left.

- q: "Why do we start the dict with `seen = {0: 1}` when counting subarrays with sum k?"
  type: single
  options:
    - To avoid a KeyError
    - It stands for the empty prefix, so subarrays starting at index 0 are counted
    - It makes the code faster
    - It is only needed when k is 0
  answer: [1]
  explain: A subarray starting at index 0 has sum `prefix[j] - 0`. The `0` entry represents that empty prefix.

- q: Why is prefix sum + dict better than sliding window for "count subarrays with sum k" when numbers can be negative?
  type: single
  options:
    - It uses less memory
    - Sliding window needs the sum to move in one direction when you add an item, and negatives break that
    - Sliding window cannot count anything
    - It is not better
  answer: [1]
  explain: With negatives the sum can go down when the window grows, so you cannot decide when to shrink.

- q: For the LONGEST subarray with a given sum, what do you store in the dict?
  type: single
  options:
    - The last index of each prefix value
    - The first index of each prefix value
    - How many times each prefix value appeared
    - The prefix values in a set
  answer: [1]
  explain: The earliest index gives the longest range. Only save a prefix value when you see it for the first time.

- q: |
    A difference array starts as `[0, 0, 0, 0, 0, 0]` (n = 5, one extra slot). You apply "add 3 to indexes 1..2" by doing `diff[1] += 3` and `diff[3] -= 3`. What does the running sum of the first 5 slots give?
  type: single
  options: ["[0, 3, 3, 0, 0]", "[0, 3, 0, -3, 0]", "[3, 3, 0, 0, 0]", "[0, 3, 3, 3, 0]"]
  answer: [0]
  explain: "Running sum is 0, 3, 3, then 3 - 3 = 0, then 0."

- q: Two prefix sums have the same remainder when divided by k. What is true about the part between them?
  type: single
  options: ["Its sum is divisible by k", "Its sum equals k", "Its sum is 0", "Nothing"]
  answer: [0]
  explain: The difference of two numbers with the same remainder is a multiple of k.

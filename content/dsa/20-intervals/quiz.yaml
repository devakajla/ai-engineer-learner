- q: "Why do we sort intervals by start time before merging?"
  type: single
  options:
    - "Python requires sorted input"
    - "After sorting, an overlapping interval is always next to the current merged one"
    - "To make the end times equal"
    - "To remove duplicates"
  answer: [1]
  explain: "Sorted by start, you only compare each interval with the last merged one in a single pass."

- q: |
    What is the output?
    ```python
    merged = []
    for s, e in sorted([[1, 4], [2, 3], [6, 7]]):
        if merged and s <= merged[-1][1]:
            merged[-1][1] = max(merged[-1][1], e)
        else:
            merged.append([s, e])
    print(merged)

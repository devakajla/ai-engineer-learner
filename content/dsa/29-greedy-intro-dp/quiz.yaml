- q: "What does a greedy algorithm do?"
  type: single
  options: ["Takes the best local choice at each step and never goes back", "Tries every possible answer", "Stores every sub-answer in a table", "Sorts the input only"]
  answer: [0]
  explain: "Greedy commits to the best-looking choice now. It is correct only when this leads to the global best."

- q: "Coins [1, 3, 4], amount 6. What does greedy (biggest coin first) give, and what is the best?"
  type: single
  options: ["3 coins, best is 2", "2 coins, best is 2", "3 coins, best is 3", "2 coins, best is 1"]
  answer: [0]
  explain: "Greedy takes 4+1+1 = 3 coins. The best is 3+3 = 2 coins. So coin change needs DP."

- q: |
    What is the output?
    ```python
    prev, cur = 1, 1
    for _ in range(4):
        prev, cur = cur, prev + cur
    print(cur)
    ```
  type: single
  options: ["8", "5", "13", "6"]
  answer: [0]
  explain: "cur goes 1, 2, 3, 5, 8 over the four loops. This is climb_stairs(5)."

- q: "In 0/1 knapsack with one array, why does the capacity loop go backwards?"
  type: single
  options: ["So each item is used only once", "To be faster", "To sort the items", "Python requires it"]
  answer: [0]
  explain: "Going forwards lets best[c - weight] already include the same item, so it could be used again."

- q: "Counting coin combinations (order does not matter): which loop is outside?"
  type: single
  options: ["The loop over coins", "The loop over amounts", "Either one gives the same result", "Neither, use recursion"]
  answer: [0]
  explain: "With coins outside, each combination is built in one fixed coin order, so 1+2 and 2+1 are not counted twice."

- q: "Which things must you decide before writing a DP solution?"
  type: multi
  options: ["What dp[i] means", "The transition from smaller states", "The base case", "Which cell is the answer"]
  answer: [0, 1, 2, 3]
  explain: "These four steps are the whole recipe: state, transition, base case, answer."

- q: "LIS: what does best[i] store?"
  type: single
  options: ["The longest increasing subsequence that ends at index i", "The longest one that starts at i", "The value at index i", "The number of smaller items"]
  answer: [0]
  explain: "Each best[i] is built from best[j] for earlier j with a smaller value."

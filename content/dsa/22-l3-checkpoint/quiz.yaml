- q: "Subarray sum equals k, with negative numbers allowed. Which pattern?"
  type: single
  options: ["Prefix sum + dict", "Sliding window", "Binary search", "Two pointers on sorted input"]
  answer: [0]
  explain: "With negatives the window sum does not move in one direction, so a window breaks. Prefix sums with a dict work."

- q: "Which problems are monotonic stack problems?"
  type: multi
  options: ["Next greater element", "Daily temperatures", "Merge intervals", "Largest rectangle in a histogram"]
  answer: [0, 1, 3]
  explain: "These ask about the nearest bigger or smaller item. Merge intervals is sort + merge."

- q: "Find the smallest ship capacity for D days. Which pattern?"
  type: single
  options: ["Binary search on the answer", "Kadane", "Prefix sum", "Stack"]
  answer: [0]
  explain: "A capacity either works or not, and it flips once as capacity grows."

- q: "Longest substring with at most 2 kinds of letters. Which pattern?"
  type: single
  options: ["Sliding window with a counter-dict", "Binary search", "Interval merge", "Kadane"]
  answer: [0]
  explain: "Grow the window, count letters, shrink when there are 3 kinds."

- q: |
    What is the output?
    ```python
    nums = [2, -1, 3, -4, 5]
    cur = best = nums[0]
    for n in nums[1:]:
        cur = max(n, cur + n)
        best = max(best, cur)
    print(best)
    ```
  type: single
  options: ["5", "6", "4", "3"]
  answer: [0]
  explain: "cur goes 2, 1, 4, 0, 5. The best is 5 (the last item alone beats 0 + 5 only equally, and 4 is smaller)."

- q: "Closed intervals [1, 4] and [4, 5]: after sorting by start, which check merges them?"
  type: single
  options: ["start <= last_end", "start < last_end", "start == last_end + 1", "start > last_end"]
  answer: [0]
  explain: "For closed intervals touching counts as overlapping, so use <=."
